# Gsheets-to-ics.conf — column header names and other settings for sheets-to-ics.js
#
# Each of the lines below maps an internal field to the exact text of the
# corresponding column header in the sheet. Order doesn't matter — whichever
# column actually contains this text is used, wherever it sits in the row.
# Matching is case-insensitive but otherwise exact (whitespace-trimmed).
#
# A field's value can be a comma-separated list of acceptable header texts —
# useful because the 2026 and 2027 sheets don't actually use identical
# wording for every column ("Organiser" vs "Organizer", "Key Topics" vs
# "Topics"), but both need to work from this one shared config.
#
# "topics" is the one field that can be deleted or commented out entirely to
# make Key Topics optional: with it gone, there's no Topics: line in the
# description and no "Topics empty" warning. Every other field below is
# required.

organiser = Organiser, Organizer
name = Event
quarter = Quarter
start = Start
end = End
city = City
country = Country
region = Region
topics = Key Topics, Topics
link = Website

# Appended, verbatim, to the end of every event's description.
boilerplate = Taken from Mark Lenahan's Global Travel Tech Conferences lists 2026 & 2027, visit https://marklenahan.com/conferences for links to the full listings and calendar subscriptions. Additions and corrections welcome.
